name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: run_planner_test
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: runner-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runner -d run_planner_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements.lock

      - name: Install backend dependencies
        run: python -m pip install --constraint backend/requirements.lock -e "backend[dev]"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Backend lint
        run: python -m ruff check backend/app backend/tests

      - name: Backend tests and coverage
        working-directory: backend
        run: python -m pytest --cov=app --cov-report=term-missing

      - name: Backend PostgreSQL integration tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://runner:runner-test-password@localhost:5432/run_planner_test
          RUN_PLANNER_ALLOW_DESTRUCTIVE_TESTS: "1"
        run: python -m pytest

      - name: Frontend lint and typecheck
        run: npm --prefix frontend run lint

      - name: Frontend typecheck
        run: npm --prefix frontend run typecheck

      - name: Frontend tests and coverage
        run: npm --prefix frontend run test:coverage

      - name: Frontend production build
        run: npm --prefix frontend run build
